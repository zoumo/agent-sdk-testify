[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-sdk-testify-driver"
dynamic = ["version"]
description = "Codex and Pi official SDK drivers for agent-sdk-testify"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
codex = ["openai-codex"]

[project.scripts]
agent-sdk-testify-codex = "codex_driver:main"
agent-sdk-testify-pi = "pi_driver:main"

[tool.setuptools]
packages = ["record_user_story", "record_user_story.adapters", "codex_driver", "pi_driver"]

[tool.setuptools.package-dir]
record_user_story = "common/record_user_story"
"record_user_story.adapters" = "common/record_user_story/adapters"
codex_driver = "codex/official/codex_driver"
pi_driver = "pi/official/pi_driver"

[tool.setuptools.package-data]
pi_driver = ["*.mjs"]
record_user_story = ["schemas/*.json", "examples/*.json", "examples/bindings/*.json"]

[tool.setuptools.dynamic]
version = {attr = "record_user_story.__version__"}
