name: Offline platform validation

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label for the platform
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.task }}
    strategy:
      fail-fast: false
      matrix:
        task: [checks, race, e2e]
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
      - uses: actions/setup-python@v7
        if: matrix.task == 'checks'
        with:
          python-version: '3.x'
      - name: Prepare Go dependencies
        run: go mod download
      - name: Prepare Python build dependencies
        if: matrix.task == 'checks'
        run: python3 -m pip install 'setuptools>=68' wheel
      - name: Install golangci-lint
        if: matrix.task == 'checks'
        shell: bash
        env:
          GOLANGCI_LINT_VERSION: '2.12.2'
        run: |
          archive="golangci-lint-${GOLANGCI_LINT_VERSION}-$(go env GOOS)-$(go env GOARCH).tar.gz"
          release="https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT_VERSION}"
          cd "$(mktemp -d "$RUNNER_TEMP/golangci-lint.XXXXXXXX")"
          curl --fail --silent --show-error --location --retry 3 "$release/$archive" --output "$archive"
          curl --fail --silent --show-error --location --retry 3 \
            "$release/golangci-lint-${GOLANGCI_LINT_VERSION}-checksums.txt" --output checksums.txt
          awk -v archive="$archive" '$2 == archive' checksums.txt > "$archive.sha256"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            shasum -a 256 -c "$archive.sha256"
          else
            sha256sum -c "$archive.sha256"
          fi
          tar -xzf "$archive" --strip-components=1 "${archive%.tar.gz}/golangci-lint"
          ./golangci-lint version
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Validate offline
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          PIP_NO_INDEX: '1'
          GOTOOLCHAIN: local
          GOENV: 'off'
        run: |
          if [[ "${{ matrix.task }}" == "checks" ]]; then
            bash scripts/check-offline.sh parallel-checks
          elif [[ "${{ matrix.task }}" == "race" ]]; then
            bash scripts/check-offline.sh race
          else
            bash scripts/check-offline.sh e2e
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: standalone-${{ matrix.task }}-${{ inputs.runner }}
          path: .artifacts/acceptance
