name: Offline platform validation

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label for the platform
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.task }}
    strategy:
      fail-fast: false
      matrix:
        task: [quality, test, race, e2e, build]
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Prepare build dependencies
        run: |
          go mod download
          python3 -m pip install 'setuptools>=68' wheel
          if [[ "${{ matrix.task }}" == "quality" ]]; then
            go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
            echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          fi
      - name: Validate offline
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          PIP_NO_INDEX: '1'
          GOTOOLCHAIN: local
          GOENV: 'off'
          PYTHON: python3
        run: |
          if [[ "${{ matrix.task }}" == "quality" ]]; then
            make fmt-check lint
          fi
          bash scripts/check-offline.sh "${{ matrix.task }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: standalone-${{ matrix.task }}-${{ inputs.runner }}
          path: .artifacts/acceptance
