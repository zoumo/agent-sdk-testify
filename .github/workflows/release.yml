name: Release

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-amd64, runner: ubuntu-24.04}
          - {target: linux-arm64, runner: ubuntu-24.04-arm}
          - {target: darwin-amd64, runner: macos-15-intel}
          - {target: darwin-arm64, runner: macos-15}
    uses: ./.github/workflows/offline-platform.yml
    with:
      runner: ${{ matrix.runner }}
      release-target: ${{ matrix.target }}

  publish:
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-*64'
          path: ${{ runner.temp }}/platforms
      - name: Verify and collect native distributions
        run: |
          python3 scripts/release.py --collect "$RUNNER_TEMP/platforms" --output "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          sha256sum --check SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          options=(--latest)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            options=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/release/"* \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes "${options[@]}"
          gh release view "$GITHUB_REF_NAME" --json tagName,isDraft,isPrerelease,assets,url
