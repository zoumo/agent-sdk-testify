name: Release

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/offline-platform.yml
    with:
      runner: ubuntu-latest

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Prepare build dependencies
        run: |
          go mod download
          python3 -m pip install 'setuptools>=68' wheel
      - name: Build and verify release artifacts
        env:
          GOTOOLCHAIN: local
          GOENV: 'off'
          GOPROXY: 'off'
          GOSUMDB: 'off'
          PIP_NO_INDEX: '1'
        run: |
          set -euo pipefail
          make release OUTPUT="$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          sha256sum --check SHA256SUMS
          python3 "$GITHUB_WORKSPACE/scripts/check-agent-sdk-testify-package.py" ./*.whl
          mkdir "$RUNNER_TEMP/release-smoke"
          tar -xzf "agent-sdk-testify_${GITHUB_REF_NAME}_linux_amd64.tar.gz" -C "$RUNNER_TEMP/release-smoke"
          test "$("$RUNNER_TEMP/release-smoke/agent-sdk-testify" version)" = "agent-sdk-testify $GITHUB_REF_NAME"
          test -z "$(git -C "$GITHUB_WORKSPACE" status --porcelain)"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          options=(--latest)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            options=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/release/"* \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes "${options[@]}"
          gh release view "$GITHUB_REF_NAME" --json tagName,isDraft,isPrerelease,assets,url
