name: Standalone offline validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read

jobs:
  ubuntu:
    name: ubuntu
    permissions:
      contents: read
    uses: ./.github/workflows/offline-platform.yml
    with:
      runner: ubuntu-latest

  macos:
    name: macos
    permissions:
      contents: read
    uses: ./.github/workflows/offline-platform.yml
    with:
      runner: macos-latest

  required:
    name: offline (required)
    if: always()
    needs: [ubuntu, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Require all offline validation jobs
        env:
          UBUNTU: ${{ needs.ubuntu.result }}
          MACOS: ${{ needs.macos.result }}
        run: |
          set -euo pipefail
          echo "ubuntu: ${UBUNTU}"
          echo "macos: ${MACOS}"
          test "${UBUNTU}" = success
          test "${MACOS}" = success
