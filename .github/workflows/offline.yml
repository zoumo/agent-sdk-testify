name: Standalone offline validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read

jobs:
  offline:
    name: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu' || 'macos' }} / ${{ matrix.task }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        task: [quality, test, race, e2e, build]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Prepare build dependencies
        run: |
          go mod download
          python3 -m pip install 'setuptools>=68' wheel
          if [[ "${{ matrix.task }}" == "quality" ]]; then
            go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
            echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          fi
      - name: Validate offline
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          PIP_NO_INDEX: '1'
          GOTOOLCHAIN: local
          GOENV: 'off'
          PYTHON: python3
        run: |
          if [[ "${{ matrix.task }}" == "quality" ]]; then
            make fmt-check lint
          fi
          bash scripts/check-offline.sh "${{ matrix.task }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standalone-${{ matrix.task }}-${{ matrix.os }}
          path: .artifacts/acceptance

  required:
    name: offline (required)
    if: always()
    needs: offline
    runs-on: ubuntu-latest
    steps:
      - name: Require all offline validation jobs
        env:
          RESULT: ${{ needs.offline.result }}
        run: |
          set -euo pipefail
          echo "offline matrix result: ${RESULT}"
          test "${RESULT}" = success
